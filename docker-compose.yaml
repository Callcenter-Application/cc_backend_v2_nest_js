# Pick the database with --env-file (also used for ${...} interpolation below):
#   docker compose --env-file .env.local --profile local up --build   # app + local Postgres
#   docker compose --env-file .env.supabase up --build                # app only, Supabase DB
services:
  app:
    build: ./
    env_file:
      - ${APP_ENV_FILE:-.env.local}
    container_name: ${CONTAINER_NAME}
    ports:
      - ${PORT}:${PORT}
    depends_on:
      db:
        condition: service_healthy
        # Skipped when the `local` profile is off (Supabase mode).
        required: false
    restart: always

  db:
    image: postgres:15.3-alpine
    profiles: ["local"]
    env_file:
      - ${APP_ENV_FILE:-.env.local}
    container_name: ${POSTGRES_NAME:-callbook_db}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
